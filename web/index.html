 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>web</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZT4GKMH93F"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag(){dataLayer.push(arguments)}
      gtag('js', new Date())
      gtag('config', 'G-ZT4GKMH93F', { send_page_view: false })
    </script>
    <script>
      ;(() => {
        const pendingRoute = sessionStorage.getItem('gh-pages-route')
        if (!pendingRoute) return

        sessionStorage.removeItem('gh-pages-route')
        const currentUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`
        if (pendingRoute !== currentUrl) {
          window.history.replaceState(null, '', pendingRoute)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
